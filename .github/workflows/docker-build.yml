name: docker-build

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/docker-build.yml"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/harish0047/aws-devops-platform-app:latest
            ghcr.io/harish0047/aws-devops-platform-app:${{ github.sha }}
